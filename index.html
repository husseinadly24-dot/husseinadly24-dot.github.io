<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hussein Adly | Video Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<style>
:root{--bg:#F5F2EC;--surface:#FFFFFF;--ink:#10252B;--muted:#55676C;--line:#D9D4C8;--accent:#0A7270;--accent-ink:#FFFFFF;--play:#FF6B4A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E181C;--surface:#15242A;--ink:#EEF3F2;--muted:#9FB2B5;--line:#26393F;--accent:#4FD1C5;--accent-ink:#0E181C;--play:#FF8A6B}}
:root[data-theme="dark"]{--bg:#0E181C;--surface:#15242A;--ink:#EEF3F2;--muted:#9FB2B5;--line:#26393F;--accent:#4FD1C5;--accent-ink:#0E181C;--play:#FF8A6B}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.8;font-size:17px}
h1,h2,h3{font-family:"Readex Pro","IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.3;margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
/* hero */
.hero{padding:44px 0 36px;text-align:center;background:radial-gradient(ellipse 60% 55% at 50% 38%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%)}
.ruler{position:relative;height:34px;border-bottom:2px solid var(--ink);
background:repeating-linear-gradient(to left,var(--ink) 0 1px,transparent 1px 24px) bottom/100% 10px no-repeat,
repeating-linear-gradient(to left,var(--ink) 0 2px,transparent 2px 120px) bottom/100% 20px no-repeat}
.ruler span{position:absolute;top:0;font-size:12px;color:var(--muted);font-family:Consolas,monospace;direction:ltr}
.playhead{position:absolute;top:-8px;bottom:-2px;width:2px;background:var(--play);inset-inline-start:50%;transform:translateX(50%)}
.playhead::before{content:"";position:absolute;top:0;left:-7px;border:8px solid transparent;border-top:12px solid var(--play);border-bottom:0}
.playline{width:2px;height:44px;background:var(--play);margin:0 auto}
.avatar{width:190px;height:190px;border-radius:50%;margin:0 auto;padding:6px;background:conic-gradient(var(--accent),var(--play),var(--accent));box-shadow:0 14px 40px rgba(0,0,0,.18)}
.avatar .in{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--surface);display:grid;place-items:center;font-family:Outfit,Arial,sans-serif;font-weight:800;font-size:56px;color:var(--accent)}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero h1{font-family:Outfit,"Readex Pro",Arial,sans-serif;font-weight:800;font-size:clamp(40px,9vw,76px);letter-spacing:.02em;margin-top:22px;direction:ltr}
.hero h1::after{content:"";display:block;width:64px;height:5px;border-radius:3px;background:var(--play);margin:12px auto 0}
.tagline{direction:ltr;font-family:"Readex Pro",sans-serif;font-weight:600;color:var(--accent);font-size:clamp(14px,2.6vw,19px);margin:18px 0 12px;letter-spacing:.02em}
.bio{max-width:60ch;margin:0 auto 26px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-block;padding:12px 26px;border-radius:999px;text-decoration:none;font-weight:500;border:2px solid var(--ink);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
section{padding:44px 0}
h2{font-size:clamp(26px,4vw,36px);margin-bottom:24px;display:flex;align-items:center;gap:14px}
h2::after{content:"";flex:1;height:2px;background:var(--line)}
h3.sub{font-family:Outfit,"Readex Pro",Arial,sans-serif;font-weight:800;font-size:clamp(22px,3.4vw,30px);direction:ltr;text-align:left;margin:34px 0 18px;display:flex;align-items:center;gap:12px}
h3.sub::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--play)}
/* clients */
.clients{display:flex;flex-wrap:wrap;gap:16px}
.client{display:flex;align-items:center;gap:14px;padding:12px 24px 12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;direction:ltr}
.frame{position:relative;width:104px;height:104px;flex:none;overflow:hidden;background:var(--bg);border:3px solid var(--accent);display:grid;place-items:center;font-family:Outfit,Arial,sans-serif;font-weight:800;font-size:20px;color:var(--accent)}
.frame.circle{border-radius:50%}.frame.square{border-radius:16px}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.client b{font-family:Outfit,"Readex Pro",Arial,sans-serif;font-weight:800;font-size:26px;letter-spacing:.02em}
/* scroll arrow */
.scroll-down{width:54px;height:54px;margin:0 auto;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;text-decoration:none;animation:bob 1.6s ease-in-out infinite}
.scroll-down:hover{background:var(--accent)}
.chev{width:14px;height:14px;border-right:3px solid var(--accent);border-bottom:3px solid var(--accent);transform:rotate(45deg);margin-top:-5px}
.scroll-down:hover .chev{border-color:var(--accent-ink)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
/* video cards */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.vcard{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
a.vcard:hover,a.vcard:focus-visible{transform:perspective(900px) translateY(-6px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));border-color:var(--accent);box-shadow:0 14px 30px rgba(0,0,0,.18)}
.media{position:relative;overflow:hidden;background:linear-gradient(135deg,#10252B,#0A7270);aspect-ratio:9/16}
.pod .media{aspect-ratio:16/9}
.vcard:nth-child(3n+2) .media{background:linear-gradient(135deg,#3B1F2B,#E4572E)}
.vcard:nth-child(3n) .media{background:linear-gradient(135deg,#102A43,#2F6FDE)}
.media img,.media video,.media iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.media iframe{pointer-events:none}
.pbtn{position:absolute;inset-inline-end:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:var(--play);display:grid;place-items:center;z-index:2;transition:opacity .2s}
.pbtn::after{content:"";border:7px solid transparent;border-inline-start:11px solid #10252B;border-inline-end:0;margin-inline-start:-2px}
.vcard.playing .pbtn{opacity:0}
/* card animations */
.vgrid:not(.in-view) .vcard{opacity:0;transform:translateY(34px) scale(.94)}
.vgrid.in-view .vcard{animation:cardIn .75s cubic-bezier(.2,.9,.3,1.15) backwards;animation-delay:calc(var(--i)*.1s)}
@keyframes cardIn{from{opacity:0;transform:translateY(34px) scale(.94)}}
.media img{transition:transform .8s cubic-bezier(.2,.7,.3,1)}
a.vcard:hover .media img{transform:scale(1.1)}
.media::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-130%)}
a.vcard:hover .media::before{transform:translateX(130%);transition:transform .9s ease}
.pbtn::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--play);opacity:.55;z-index:-1;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
.vcard.empty .media{background-size:220% 220%;animation:flow 7s ease-in-out infinite}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.cap{padding:9px 12px;font-family:"Readex Pro",sans-serif;font-size:14px;direction:ltr;text-align:left;display:flex;justify-content:space-between;gap:8px}
.cap small{color:var(--muted);font-family:Consolas,monospace}
.vcard.empty{opacity:.75}
.vcard.empty .pbtn{display:none}
.vcard.empty .media::after{content:"+ Add video link";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;font-family:"Readex Pro",sans-serif;text-align:center;padding:8px}
.reelbox{margin-bottom:10px}
.pod.n1{grid-template-columns:1fr}.pod.n2{grid-template-columns:repeat(2,1fr)}
.pod.n1 .pbtn{width:66px;height:66px;inset-inline-end:18px;bottom:18px}.pod.n1 .pbtn::after{border-width:12px;border-inline-start-width:19px}.pod.n1 .cap{font-size:17px;padding:12px 16px}
@media (max-width:560px){.vgrid{gap:8px}.pod.vgrid{grid-template-columns:1fr}.cap{font-size:12px;padding:6px 8px}}
/* services */
.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.svc{padding:18px 20px;border-inline-start:4px solid var(--play);background:var(--surface);border-radius:10px}
.svc h3{font-size:18px;margin-bottom:4px}
.svc p{margin:0;color:var(--muted);font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.tools span{padding:6px 16px;border:2px solid var(--accent);color:var(--accent);border-radius:8px;font-family:"Readex Pro",sans-serif;font-size:15px}
/* contact */
.contact{background:var(--ink);color:var(--bg);border-radius:20px;padding:40px 28px;text-align:center;margin-bottom:40px}
.contact h2{justify-content:center;color:var(--bg)}
.contact h2::after{display:none}
.contact p{margin:0 auto 22px;max-width:46ch;opacity:.85}
.contact .btn{border-color:var(--bg);color:var(--bg)}
.contact .btn.primary{background:var(--play);border-color:var(--play);color:#10252B}
/* hero intro */
.hero .avatar{animation:heroIn .9s cubic-bezier(.2,.8,.2,1) .1s backwards;transition:transform .4s cubic-bezier(.2,.9,.3,1.3),box-shadow .4s}
.hero .avatar:hover{transform:scale(1.05);box-shadow:0 18px 50px color-mix(in srgb,var(--play) 45%,transparent)}
.hero h1{animation:heroIn .9s cubic-bezier(.2,.8,.2,1) .3s backwards}
.hero .tagline{animation:heroIn .9s cubic-bezier(.2,.8,.2,1) .45s backwards}
.hero .bio{animation:heroIn .9s cubic-bezier(.2,.8,.2,1) .6s backwards}
.hero .btns{animation:heroIn .9s cubic-bezier(.2,.8,.2,1) .75s backwards}
@keyframes heroIn{from{opacity:0;transform:translateY(26px) scale(.96)}}
.playhead{animation:scrub 1.6s cubic-bezier(.3,.7,.2,1) backwards}
@keyframes scrub{from{inset-inline-start:0}}
.playline{transform-origin:top;animation:growY .8s ease 1.2s backwards}
@keyframes growY{from{transform:scaleY(0)}}
/* scroll reveal */
.js .reveal:not(.in){opacity:0;transform:translateY(26px)}
.reveal.in{animation:revealIn .8s cubic-bezier(.2,.9,.3,1.1) backwards;animation-delay:calc(var(--i,0)*.1s)}
@keyframes revealIn{from{opacity:0;transform:translateY(26px)}}
a.vcard:active{transform:scale(.97)}
/* services */
.svc{position:relative;overflow:hidden;cursor:default;-webkit-tap-highlight-color:transparent;transition:transform .35s cubic-bezier(.2,.9,.3,1.3),box-shadow .35s,border-inline-start-width .3s,background .35s}
.svc::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,color-mix(in srgb,var(--play) 24%,transparent) 50%,transparent 70%);transform:translateX(-130%)}
.svc h3{transition:color .3s,transform .3s}
.svc:hover,.svc.active{transform:translateY(-8px) scale(1.02);box-shadow:0 16px 34px rgba(0,0,0,.16);border-inline-start-width:10px;background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.svc:hover::before,.svc.active::before{transform:translateX(130%);transition:transform .9s ease}
.svc:hover h3,.svc.active h3{color:var(--accent);transform:translateX(-4px)}
.tools span{cursor:default;-webkit-tap-highlight-color:transparent;transition:transform .3s cubic-bezier(.2,.9,.3,1.3),background .25s,color .25s}
.tools span:hover,.tools span.active{background:var(--accent);color:var(--accent-ink);transform:translateY(-5px) rotate(-3deg)}
.client{-webkit-tap-highlight-color:transparent;transition:transform .35s cubic-bezier(.2,.9,.3,1.3),box-shadow .35s}
.client .frame{transition:transform .5s cubic-bezier(.2,.9,.3,1.3)}
.client:hover,.client.active{transform:translateY(-6px);box-shadow:0 14px 30px rgba(0,0,0,.16)}
.client:hover .frame,.client.active .frame{transform:rotate(10deg) scale(1.08)}
/* contact icons */
.icons{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;padding-bottom:36px}
.ico{--brand:#FF6B4A;position:relative;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;color:var(--bg);border:2px solid color-mix(in srgb,var(--bg) 55%,transparent);text-decoration:none;transition:transform .3s cubic-bezier(.2,.9,.3,1.3),background .3s,border-color .3s,box-shadow .3s,color .3s}
.ico svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s}
.icons:not(.in-view) .ico{opacity:0;transform:translateY(24px) scale(.7)}
.icons.in-view .ico{animation:icoIn .7s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--i)*.12s)}
@keyframes icoIn{from{opacity:0;transform:translateY(24px) scale(.7)}}
.ico:hover,.ico:focus-visible{transform:translateY(-8px) scale(1.08);background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 14px 28px color-mix(in srgb,var(--brand) 55%,transparent)}
.ico:hover svg,.ico:focus-visible svg{transform:rotate(-8deg) scale(1.12)}
.ico.whatsapp{--brand:#25D366}.ico.instagram{--brand:#E1306C}.ico.linkedin{--brand:#0A66C2}.ico.email{--brand:#FF6B4A}
.ico.instagram:hover{background:linear-gradient(45deg,#F9A03F,#E1306C,#7B3FE4);border-color:transparent}
.ico::before{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--brand);opacity:0;pointer-events:none}
.icons.in-view .ico.whatsapp::before{animation:ring 2.4s ease-out 1.2s infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.6);opacity:0}}
.ico::after{content:attr(data-label);position:absolute;bottom:-32px;left:50%;transform:translateX(-50%) translateY(-4px);font-size:13px;font-family:"Readex Pro",sans-serif;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;color:var(--bg)}
.ico:hover::after,.ico:focus-visible::after{opacity:1;transform:translateX(-50%)}
footer{text-align:center;color:var(--muted);font-size:14px;padding:0 0 32px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.icons:not(.in-view) .ico,.vgrid:not(.in-view) .vcard,.js .reveal:not(.in){opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <div class="ruler" aria-hidden="true"><span style="inset-inline-start:0">00:00</span><span style="inset-inline-start:33%">00:30</span><span style="inset-inline-start:66%">01:00</span><div class="playhead"></div></div>
    <div class="playline" aria-hidden="true"></div>
    <div class="avatar"><div class="in" id="avatar"></div></div>
    <h1 id="name"></h1>
    <div class="tagline" id="tagline"></div>
    <p class="bio" id="bio"></p>
    <div class="btns"><a class="btn primary" href="#work">شاهد أعمالي</a><a class="btn" href="#contact">تواصل معايا</a></div>
  </header>

  <section id="clientsSec"><h2>اشتغلت مع</h2><div class="clients" id="clients"></div></section>
  <a class="scroll-down" href="#work" aria-label="انزل لأعمالي"><span class="chev"></span></a>

  <section id="work">
    <h2>أعمالي</h2>
    <div id="reelBox" class="reelbox"></div>
    <h3 class="sub">Reels Editing</h3>
    <div class="vgrid reels" id="reels"></div>
    <h3 class="sub">Podcast Editing</h3>
    <div class="vgrid pod" id="pods"></div>
  </section>

  <section id="services"><h2>الخدمات</h2><div class="services" id="svcList"></div><div class="tools" id="tools"></div></section>

  <section class="contact" id="contact">
    <h2>خلينا نشتغل سوا</h2>
    <p id="contactText"></p>
    <div class="icons" id="contactBtns"></div>
  </section>
  <footer id="foot"></footer>
</main>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const link = (l, cls) => `<a class="btn ${cls||""}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`;

/* التعرف على نوع الرابط */
function media(url){
  url = String(url||"").trim(); let m;
  if ((m = url.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/))) return {k:"yt", id:m[1]};
  if ((m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([\w-]+)/))) return {k:"drive", id:m[1]};
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return {k:"vimeo", id:m[1]};
  if (/\.(mp4|webm|mov)(\?|$)/i.test(url)) return {k:"file", url};
  return {k:"other"};
}
function thumbOf(it){
  if (it.thumb) return it.thumb;
  const m = media(it.url);
  if (m.k === "yt") return "https://img.youtube.com/vi/" + m.id + "/hqdefault.jpg";
  if (m.k === "drive") return "https://drive.google.com/thumbnail?id=" + m.id + "&sz=w800";
  return "";
}
function previewEl(it){
  const pv = it.preview ? {k:"file", url:it.preview} : media(it.url);
  let el;
  if (pv.k === "file") { el = document.createElement("video"); el.src = pv.url; el.muted = true; el.loop = true; el.playsInline = true; el.autoplay = true; el.play && el.play().catch(()=>{}); return el; }
  const src = pv.k === "yt" ? `https://www.youtube.com/embed/${pv.id}?autoplay=1&mute=1&controls=0&loop=1&playlist=${pv.id}&playsinline=1&modestbranding=1`
    : pv.k === "drive" ? `https://drive.google.com/file/d/${pv.id}/preview`
    : pv.k === "vimeo" ? `https://player.vimeo.com/video/${pv.id}?autoplay=1&muted=1&loop=1&background=1` : "";
  if (!src) return null;
  el = document.createElement("iframe"); el.src = src; el.allow = "autoplay; encrypted-media"; el.setAttribute("tabindex","-1"); el.setAttribute("aria-hidden","true");
  return el;
}
function cards(list, boxId){
  $(boxId).innerHTML = list.map((it,i) => {
    const t = thumbOf(it), fb = thumbOf({url: it.url}), n = String(i+1).padStart(2,"0");
    const inner = `<div class="media">${t ? `<img src="${esc(t)}" alt="" loading="lazy" ${fb && fb !== t ? `data-fb="${esc(fb)}"` : ""} onerror="var f=this.dataset.fb;if(f){this.dataset.fb='';this.src=f}else{this.remove()}">` : ""}<span class="pbtn"></span></div><div class="cap"><span>${esc(it.title||"")}</span><small>${n}</small></div>`;
    return it.url ? `<a class="vcard" style="--i:${i}" href="${esc(it.url)}" target="_blank" rel="noopener" data-i="${i}">${inner}</a>` : `<div class="vcard empty" style="--i:${i}">${inner}</div>`;
  }).join("");
  $(boxId).querySelectorAll("a.vcard").forEach(card => {
    const it = list[+card.dataset.i], box = card.querySelector(".media");
    let el = null;
    const on = () => { if (el) return; el = previewEl(it); if (el) { box.appendChild(el); card.classList.add("playing"); } };
    const off = () => { if (el) { el.remove(); el = null; card.classList.remove("playing"); } };
    card.addEventListener("mouseenter", on); card.addEventListener("mouseleave", off);
    card.addEventListener("pointermove", e => { if (e.pointerType !== "mouse") return; const r = card.getBoundingClientRect(); card.style.setProperty("--ry", ((e.clientX - r.left) / r.width - .5) * 10 + "deg"); card.style.setProperty("--rx", -((e.clientY - r.top) / r.height - .5) * 10 + "deg"); });
    card.addEventListener("mouseleave", () => { card.style.removeProperty("--rx"); card.style.removeProperty("--ry"); });
    card.addEventListener("focusin", on); card.addEventListener("focusout", off);
  });
}

const ICONS = {

  email: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7.5 12 13.5l8.5-6"/></svg>',

  linkedin: '<svg viewBox="0 0 24 24"><rect x="3.2" y="9" width="3.6" height="12" rx=".6" fill="currentColor" stroke="none"/><circle cx="5" cy="4.8" r="2.1" fill="currentColor" stroke="none"/><path d="M10 9h3.6v1.7c.6-1.2 2-2 3.7-2 3.1 0 4.2 2 4.2 5.1V21h-3.8v-6c0-1.4-.5-2.3-1.8-2.3S13.8 13.6 13.8 15v6H10z" fill="currentColor" stroke="none"/></svg>'
};
$("contactBtns").innerHTML = DATA.contacts.map((c, i) => `<a class="ico ${esc(c.icon||"")}" style="--i:${i}" href="${esc(c.url)}" ${/^https?:/.test(c.url) ? 'target="_blank" rel="noopener"' : ""} aria-label="${esc(c.label)}" data-label="${esc(c.label)}">${ICONS[c.icon] || esc(c.label)}</a>`).join("");
{ const box = $("contactBtns");
  if ("IntersectionObserver" in window) { new IntersectionObserver((e, o) => { if (e[0].isIntersecting) { box.classList.add("in-view"); o.disconnect(); } }, {threshold: .4}).observe(box); } else { box.classList.add("in-view"); } }
if ("IntersectionObserver" in window) {
  document.documentElement.classList.add("js");
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold: .15});
  document.querySelectorAll("#clientsSec h2,#work h2,#services h2,.client,.svc,.tools span,.contact").forEach(el => {
    el.classList.add("reveal");
    el.style.setProperty("--i", el.matches("h2,.contact") ? 0 : Math.min([...el.parentElement.children].indexOf(el), 8));
    io.observe(el);
  });
}
document.querySelectorAll(".svc,.tools span,.client").forEach(el => el.addEventListener("pointerdown", () => {
  el.classList.add("active"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("active"), 900);
}));
$("foot").textContent = "© " + new Date().getFullYear() + " " + DATA.name;
</script>
